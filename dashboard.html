     JAVASCRIPT

<script>


/* =====================================================
   URL POWER BI
===================================================== */

const dashboardURLs = {


  /* -----------------------------------------------------
     DATA PENDIDIK DAN TENAGA KEPENDIDIKAN
  ----------------------------------------------------- */

  "Data Pendidik dan Tenaga Kependidikan":

    "https://app.powerbi.com/reportEmbed?reportId=eeb8a1bf-3e9a-4d30-879c-0ca60a112dcb&autoAuth=true&ctid=bbf1f00a-8ea9-4f0f-a351-780708384dda",



  /* -----------------------------------------------------
     DATA TUGAS BELAJAR DIBIAYAI
  ----------------------------------------------------- */

  "Data Tugas Belajar Dibiayai":

    "https://app.powerbi.com/view?r=eyJrIjoiM2U2YTU3MmItZGVlZi00MGM1LTkzMTEtMTBiMzg0OGVhOWQwIiwidCI6IjI5ZTVlYTIwLWRhYWEtNDI5MS1hMmFlLTg3NGU2M2MxZjI5MiIsImMiOjEwfQ%3D%3D&pageName=126f929e10418231ad32",



  /* -----------------------------------------------------
     DATA TUGAS BELAJAR MANDIRI
  ----------------------------------------------------- */

  "Data Tugas Belajar Mandiri":

    "https://app.powerbi.com/view?r=eyJrIjoiM2U2YTU3MmItZGVlZi00MGM1LTkzMTEtMTBiMzg0OGVhOWQwIiwidCI6IjI5ZTVlYTIwLWRhYWEtNDI5MS1hMmFlLTg3NGU2M2MxZjI5MiIsImMiOjEwfQ%3D%3D&pageName=89be73248fff7fbd674e"

};



/* =====================================================
   ELEMENT
===================================================== */

const frame =
  document.getElementById("dashboardFrame");


const title =
  document.getElementById("dashboardTitle");


const menuItems =
  document.querySelectorAll(".menu-item");



/* =====================================================
   TAMPILKAN DASHBOARD
===================================================== */

function showDashboard(jenis, element) {


  /* Ambil URL */

  const url =
    dashboardURLs[jenis];


  /* Cek URL */

  if (!url) {

    console.error(
      "Dashboard tidak ditemukan:",
      jenis
    );

    return;

  }


  /* Masukkan URL ke iframe */

  frame.src = url;


  /* Ganti judul */

  title.textContent = jenis;


  /* Hapus menu aktif */

  menuItems.forEach(function(item) {

    item.classList.remove("active");

  });


  /* Aktifkan menu yang diklik */

  if (element) {

    element.classList.add("active");

  }

}



/* =====================================================
   SIDEBAR
===================================================== */

const sidebar =
  document.getElementById("sidebar");


const toggleBtn =
  document.getElementById("toggleBtn");


const trigger =
  document.querySelector(".sidebar-trigger");


let isClosed = false;



/* =====================================================
   TOMBOL ☰
===================================================== */

toggleBtn.addEventListener(
  "click",
  function() {


    sidebar.classList.toggle(
      "closed"
    );


    isClosed =
      sidebar.classList.contains(
        "closed"
      );


  }
);



/* =====================================================
   MOUSE KE SISI KIRI
===================================================== */

trigger.addEventListener(
  "mouseenter",
  function() {


    if (isClosed) {

      sidebar.classList.remove(
        "closed"
      );

    }


  }
);



/* =====================================================
   MOUSE KELUAR SIDEBAR
===================================================== */

sidebar.addEventListener(
  "mouseleave",
  function() {


    if (isClosed) {

      sidebar.classList.add(
        "closed"
      );

    }


  }
);



/* =====================================================
   DASHBOARD DEFAULT
===================================================== */

/*
   Saat halaman dibuka, dashboard pertama
   langsung ditampilkan.
*/

showDashboard(
  "Data Pendidik dan Tenaga Kependidikan",
  document.querySelector(".menu-item")
);


</script>


</body>

</html>
