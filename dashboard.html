</head>

<script>

function loadDashboard(jenis) {

    // Dashboard TUBEL Gabungan
    if (jenis === "gabungan") {
        document.getElementById("dashboardGabungan").style.display = "block";
        document.getElementById("dashboardMandiri").style.display = "none";
        document.getElementById("dashboardDibiayai").style.display = "none";
        document.getElementById("dashboardKetenagaan").style.display = "none";
    }

    // Dashboard TUBEL Mandiri saja
    if (jenis === "mandiri") {
        document.getElementById("dashboardGabungan").style.display = "none";
        document.getElementById("dashboardMandiri").style.display = "block";
        document.getElementById("dashboardDibiayai").style.display = "none";
        document.getElementById("dashboardKetenagaan").style.display = "none";
    }

    // Dashboard TUBEL Dibiayai saja
    if (jenis === "dibiayai") {
        document.getElementById("dashboardGabungan").style.display = "none";
        document.getElementById("dashboardMandiri").style.display = "none";
        document.getElementById("dashboardDibiayai").style.display = "block";
        document.getElementById("dashboardKetenagaan").style.display = "none";
    }

    // Dashboard Ketenagaan saja
    if (jenis === "ketenagaan") {
        document.getElementById("dashboardGabungan").style.display = "none";
        document.getElementById("dashboardMandiri").style.display = "none";
        document.getElementById("dashboardDibiayai").style.display = "none";
        document.getElementById("dashboardKetenagaan").style.display = "block";
    }

}

</script>
  
<body>

<script>

<!-- SCRIPT AUTO HIDE -->
<script>
const sidebar = document.getElementById("sidebar");
const toggleBtn = document.getElementById("toggleBtn");
const trigger = document.querySelector(".sidebar-trigger");

let isClosed = false;

// Klik tombol ☰
toggleBtn.addEventListener("click", function() {
  sidebar.classList.toggle("closed");
  isClosed = sidebar.classList.contains("closed");
});

// Hover kiri layar
trigger.addEventListener("mouseenter", function() {
  if (isClosed) {
    sidebar.classList.remove("closed");
  }
});

// Keluar dari sidebar
sidebar.addEventListener("mouseleave", function() {
  if (isClosed) {
    sidebar.classList.add("closed");
  }
});
</script>
